name: k6 manual load test

# Manual-only. Never runs automatically, never targets production unless a
# human explicitly types the confirmation phrase and a non-local target_url.
# See k6/README.md.

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: "URL to target (must be a URL you are authorised to load-test)"
        required: true
        default: "http://127.0.0.1:3000"
      vus:
        description: "Virtual users (kept low intentionally)"
        required: true
        default: "5"
      duration:
        description: "Duration, e.g. 30s, 1m"
        required: true
        default: "1m"
      confirm:
        description: 'Type exactly: I understand this targets a real, possibly production, environment'
        required: true

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Verify confirmation phrase
        id: check
        run: |
          expected="I understand this targets a real, possibly production, environment"
          if [ "${{ github.event.inputs.confirm }}" != "$expected" ]; then
            echo "Confirmation phrase did not match exactly. Aborting without running k6."
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi
          echo "proceed=true" >> "$GITHUB_OUTPUT"

  load-test:
    needs: guard
    if: needs.guard.outputs.proceed == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run k6 load test against the confirmed target
        uses: grafana/k6-action@v0.3.1
        with:
          filename: k6/load.js
        env:
          TARGET_URL: ${{ github.event.inputs.target_url }}
          VUS: ${{ github.event.inputs.vus }}
          DURATION: ${{ github.event.inputs.duration }}

      - name: Upload k6 summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k6-load-test-summary
          path: summary.json
          retention-days: 14
          if-no-files-found: ignore
