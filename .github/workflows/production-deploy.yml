name: Manual production deployment

on:
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Full 40-character commit SHA from main to deploy
        required: true
        type: string
      confirmation:
        description: Type DEPLOY PRODUCTION
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: autotime-production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Verify and deploy selected commit
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: production
    env:
      DEPLOY_SHA: ${{ inputs.commit_sha }}
      DEPLOY_CONFIRMATION: ${{ inputs.confirmation }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: team_eYfFWCwi1Hh0FJoPORmr6pcb
      VERCEL_PROJECT_ID: prj_XUEts6JIkUeZ4pcUIIKl2FiXgqeC

    steps:
      - name: Checkout main history
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Validate release authorization and commit
        shell: bash
        run: |
          set -euo pipefail
          test "$DEPLOY_CONFIRMATION" = "DEPLOY PRODUCTION"
          [[ "$DEPLOY_SHA" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$DEPLOY_SHA" origin/main
          git checkout --detach "$DEPLOY_SHA"
          test "$(git rev-parse HEAD)" = "$DEPLOY_SHA"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Run release gates
        run: |
          pnpm typecheck
          pnpm test:mobility-suite

      - name: Link Vercel project
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Configure VERCEL_TOKEN in the production GitHub environment}"
          pnpm dlx vercel@59.7.0 pull --yes --environment=production --token="$VERCEL_TOKEN"

      # Captured before the new build goes live, so a failed smoke check
      # below has something concrete to restore - see "Roll back" step.
      # Added 2026-09-17 after a bad Production env var left every
      # authenticated route 503ing while the deploy itself reported
      # success; the smoke check now catches that (see "Verify deployed
      # surface"), but without this, a caught failure still left the
      # broken build live until someone rolled back by hand.
      - name: Capture current production deployment for rollback
        id: previous
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Configure VERCEL_TOKEN in the production GitHub environment}"
          response="$(curl -sS -H "Authorization: Bearer $VERCEL_TOKEN" \
            "https://api.vercel.com/v6/deployments?projectId=$VERCEL_PROJECT_ID&teamId=$VERCEL_ORG_ID&target=production&state=READY&limit=1")"
          previous_url="$(echo "$response" | jq -r '.deployments[0].url // empty')"
          if [ -z "$previous_url" ]; then
            echo "No existing READY production deployment found - nothing to roll back to (likely the first deploy)."
          else
            echo "Current production deployment before this run: https://$previous_url"
          fi
          echo "url=$previous_url" >> "$GITHUB_OUTPUT"

      - name: Build and deploy production
        id: deploy
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Configure VERCEL_TOKEN in the production GitHub environment}"
          pnpm dlx vercel@59.7.0 build --prod --token="$VERCEL_TOKEN"
          deployment_url="$(pnpm dlx vercel@59.7.0 deploy --prebuilt --prod --yes --token="$VERCEL_TOKEN")"
          echo "url=$deployment_url" >> "$GITHUB_OUTPUT"

      - name: Verify deployed surface
        env:
          WEB_SMOKE_URL: ${{ steps.deploy.outputs.url }}
        run: pnpm smoke:web

      # `vercel deploy --prod` is documented to auto-claim the project's
      # default production alias, but has been observed three times in
      # production (2026-09-20 morning, 2026-09-20 evening, 2026-09-21 -
      # see docs/quality-assurance.md) reporting success while silently
      # leaving autotime-eu-apply.vercel.app pointed at a stale, older
      # deployment - across three different trigger scenarios, so this is
      # a systemic gap in this CLI-token-based deploy path, not a fluke.
      # Making the claim explicit and independently verifying it, instead
      # of trusting either "vercel deploy"'s or this step's own exit code,
      # closes that gap: a mismatch here fails the job and triggers the
      # rollback step below, same as a failed smoke check would.
      - name: Claim and verify the production domain alias
        id: alias
        shell: bash
        env:
          PROD_DOMAIN: autotime-eu-apply.vercel.app
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Configure VERCEL_TOKEN in the production GitHub environment}"
          pnpm dlx vercel@59.7.0 alias set "${{ steps.deploy.outputs.url }}" "$PROD_DOMAIN" --token="$VERCEL_TOKEN"

          # `vercel inspect --json` prints a "Fetching deployment ..." line
          # before the JSON body, so keep only from the first `{` onward.
          resolved_id="$(pnpm dlx vercel@59.7.0 inspect "$PROD_DOMAIN" --json --token="$VERCEL_TOKEN" | sed -n '/^{/,$p' | jq -r '.id // empty')"
          expected_id="$(pnpm dlx vercel@59.7.0 inspect "${{ steps.deploy.outputs.url }}" --json --token="$VERCEL_TOKEN" | sed -n '/^{/,$p' | jq -r '.id // empty')"

          echo "Production domain ($PROD_DOMAIN) currently resolves to deployment: ${resolved_id:-<none>}"
          echo "This run's deployment id: ${expected_id:-<unknown>}"

          if [ -z "$resolved_id" ] || [ -z "$expected_id" ] || [ "$resolved_id" != "$expected_id" ]; then
            echo "::error::Production domain $PROD_DOMAIN does not resolve to this run's deployment ($expected_id) even after an explicit alias claim (resolved: ${resolved_id:-<none>}). Treating this deploy as failed."
            exit 1
          fi

      # Runs only if a prior step in this job failed (the smoke check or
      # the alias claim/verification above) and there is a previous
      # deployment to restore to.
      # A smoke-check failure happens before this run's deploy has claimed
      # the production alias at all (see "Claim and verify the production
      # domain alias" above, which now runs after the smoke check), so the
      # live domain should still be on the previous deployment already in
      # that case; this rollback call is what actively restores it when
      # the alias step itself is what failed (e.g. the claim succeeded but
      # verification caught a mismatch) or as a defensive no-op otherwise.
      - name: Roll back to previous production deployment
        if: failure() && steps.previous.outputs.url != ''
        shell: bash
        run: |
          set -euo pipefail
          : "${VERCEL_TOKEN:?Configure VERCEL_TOKEN in the production GitHub environment}"
          echo "::warning::Deployment verification failed - rolling production back to https://${{ steps.previous.outputs.url }}"
          pnpm dlx vercel@59.7.0 rollback "https://${{ steps.previous.outputs.url }}" --token="$VERCEL_TOKEN" --yes
          {
            echo "## Automatic rollback"
            echo "- Failed deployment: \`$DEPLOY_SHA\` (${{ steps.deploy.outputs.url }})"
            echo "- Rolled back to: https://${{ steps.previous.outputs.url }}"
            echo "- Reason: either the post-deploy smoke check (pnpm smoke:web) or the production alias claim/verification failed - see the failed step's log above."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Warn when no rollback target exists after a failure
        if: failure() && steps.previous.outputs.url == ''
        shell: bash
        run: |
          echo "::error::Deployment verification failed and no previous READY production deployment was found to roll back to. Production may currently be serving the broken build at ${{ steps.deploy.outputs.url }} - check manually."

      - name: Record deployment evidence
        if: success()
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        shell: bash
        run: |
          {
            echo "## Production deployment"
            echo "- Commit: \`$DEPLOY_SHA\`"
            echo "- URL: $DEPLOYMENT_URL"
            echo "- Verification: typecheck, mobility suite, production build, deployed smoke, production alias claim+verification"
          } >> "$GITHUB_STEP_SUMMARY"
