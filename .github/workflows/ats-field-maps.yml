name: ATS field map evidence

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read
  issues: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - name: Run read-only field-map checks
        id: fieldmaps
        continue-on-error: true
        run: node --experimental-strip-types scripts/verify-ats-field-maps-live.mjs
      - name: Upload detailed evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ats-field-maps-${{ github.run_id }}
          path: artifacts/coverage/
          retention-days: 90
      - name: Open or update regression issues
        if: steps.fieldmaps.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const report = JSON.parse(fs.readFileSync('artifacts/coverage/ats-field-maps.json', 'utf8'));
            for (const failure of report.results.filter(item => item.outcome === 'fail')) {
              const title = `[ats-field-map] ${failure.ats} selector check failed`;
              const fieldLines = Object.entries(failure.fields ?? {}).map(([field, state]) => `- ${field}: ${state.matched ? 'matched (' + state.selector + ')' : 'no selector matched'}`).join('\n');
              const body = `Read-only field-map check failed at ${report.checkedAt}.\n\nURL: ${failure.jobUrl}\nHTTP: ${failure.statusCode ?? 'none'}\nReason: ${failure.failureReason}\n\n${fieldLines}\n\nRun: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}\n\nNo application form was filled or submitted. If the reason is a stale fixture (job posting closed), update scripts/ats-field-map-fixtures.json rather than the selectors themselves.`;
              const existing = await github.rest.issues.listForRepo({ owner: context.repo.owner, repo: context.repo.repo, state: 'open', per_page: 100 });
              const issue = existing.data.find(item => item.title === title);
              if (issue) await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: issue.number, body });
              else await github.rest.issues.create({ owner: context.repo.owner, repo: context.repo.repo, title, body });
            }
      - name: Enforce live result
        if: steps.fieldmaps.outcome == 'failure'
        run: exit 1
