name: Full end-to-end tests

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  schedule:
    - cron: "23 2 * * *"

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install Playwright browsers
        timeout-minutes: 12
        run: |
          for attempt in 1 2 3; do
            if timeout 4m pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed or timed out (likely an apt mirror stall) - retrying..."
            sleep 10
          done
          echo "Playwright browser install failed after 3 attempts"
          exit 1
      - name: Run core Journey A-C Playwright suite
        run: pnpm test:e2e:core
        env:
          NEXT_PUBLIC_AUTOTIME_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-ci-anon-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_offline_ci
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          SUPABASE_SERVICE_ROLE_KEY: offline-ci-service-role-key
          OPENAI_API_KEY: offline-ci-openai-key
          STRIPE_SECRET_KEY: sk_test_offline_ci
          STRIPE_WEBHOOK_SECRET: whsec_offline_ci
          STRIPE_PRO_MONTHLY_PRICE_ID: price_offline_ci_monthly
          STRIPE_PRO_ANNUAL_PRICE_ID: price_offline_ci_annual
          RESEND_API_KEY: re_offline_ci
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-report
          path: playwright-report/
          retention-days: 14
