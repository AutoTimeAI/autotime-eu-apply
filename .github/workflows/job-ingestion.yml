name: Daily job ingestion
on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync EURES
        env:
          FUNCTION_BASE_URL: ${{ secrets.SUPABASE_FUNCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.JOB_SYNC_CRON_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          response=$(curl -sS --retry 3 -w "\n%{http_code}" -X POST \
            -H "x-cron-secret: $CRON_SECRET" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            "$FUNCTION_BASE_URL/sync-eures")
          status=$(echo "$response" | tail -1)
          body=$(echo "$response" | sed '$d')
          echo "$body"
          if [ "$status" = "200" ]; then
            exit 0
          fi
          # sync-eures itself returns 503 with this status when
          # EURES_PARTNER_API_URL/TOKEN aren't configured in Supabase -
          # a deliberate, documented degraded mode, not a failure.
          if [ "$status" = "503" ] && echo "$body" | grep -q "disabled_missing_authorized_partner_access"; then
            echo "EURES sync is intentionally disabled (no partner API credentials configured) - not a failure."
            exit 0
          fi
          echo "Unexpected EURES sync failure (HTTP $status)."
          exit 1
      - name: Sync direct ATS sources
        if: always()
        env:
          FUNCTION_BASE_URL: ${{ secrets.SUPABASE_FUNCTION_BASE_URL }}
          CRON_SECRET: ${{ secrets.JOB_SYNC_CRON_SECRET }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: >-
          curl --fail-with-body --retry 3 -X POST
          -H "x-cron-secret: $CRON_SECRET"
          -H "apikey: $SUPABASE_ANON_KEY"
          "$FUNCTION_BASE_URL/sync-job-sources"
