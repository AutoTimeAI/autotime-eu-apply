name: Unit Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  test:
    name: Unit tests and static checks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show checked out commit
        run: git log -1 --oneline

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify React type alignment
        run: |
          git rev-parse HEAD
          pnpm list react @types/react --recursive --depth 0
          ! grep -q "@types/react@19" pnpm-lock.yaml

      - name: Run unit tests
        run: pnpm test

      - name: Run typecheck
        run: pnpm -r typecheck

      - name: Run lint
        run: pnpm -r lint
