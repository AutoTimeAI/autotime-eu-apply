name: CI

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test:
    name: Tests, static checks, and builds
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show checked out commit
        run: git log -1 --oneline

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.33.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Python analytics dependencies
        run: python -m pip install -e "apps/analytics[dev]"

      - name: Verify React type alignment
        run: |
          git rev-parse HEAD
          pnpm list react @types/react --recursive --depth 0
          ! grep -q "@types/react@19" pnpm-lock.yaml

      - name: Run unit tests
        run: pnpm test

      - name: Verify platform coverage registry and fixtures
        run: node --experimental-strip-types scripts/platform-coverage.test.mjs

      - name: Run web interview-prep tests
        run: pnpm test:web:interview

      - name: Run web smoke unit tests
        run: pnpm test:smoke:web

      - name: Run cloud sync tests
        run: pnpm test:web:cloud-sync

      - name: Run production hardening tests
        run: pnpm test:production-hardening

      - name: Run country-fit model tests
        run: pnpm test:country-fit

      - name: Run analytics service tests
        run: python -m pytest apps/analytics/tests

      - name: Run typecheck
        run: pnpm -r typecheck

      - name: Run lint
        run: pnpm -r lint

      - name: Build extension
        run: pnpm build:extension

      - name: Build web dashboard
        run: pnpm build:web
        env:
          NEXT_PUBLIC_AUTOTIME_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-ci-anon-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_offline_ci
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          SUPABASE_SERVICE_ROLE_KEY: offline-ci-service-role-key
          OPENAI_API_KEY: offline-ci-openai-key
          STRIPE_SECRET_KEY: sk_test_offline_ci
          STRIPE_WEBHOOK_SECRET: whsec_offline_ci
          STRIPE_PRO_MONTHLY_PRICE_ID: price_offline_ci_monthly
          STRIPE_PRO_ANNUAL_PRICE_ID: price_offline_ci_annual
          RESEND_API_KEY: re_offline_ci

      - name: Work around unreliable azure.archive.ubuntu.com mirror
        run: |
          # Every observed CI hang traces to azure.archive.ubuntu.com specifically
          # stalling apt-get update - archive.ubuntu.com has resolved quickly every
          # time it was reached. Ubuntu 24.04 runners resolve apt mirrors via
          # /etc/apt/apt-mirrors.txt (a mirror+file:// candidate list, tried in
          # order); drop the azure entry so apt never waits on it.
          if [ -f /etc/apt/apt-mirrors.txt ]; then
            sudo sed -i '/azure\.archive\.ubuntu\.com/d' /etc/apt/apt-mirrors.txt
            if [ ! -s /etc/apt/apt-mirrors.txt ]; then
              echo "http://archive.ubuntu.com/ubuntu" | sudo tee /etc/apt/apt-mirrors.txt > /dev/null
            fi
          fi
          sudo sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' /etc/apt/sources.list 2>/dev/null || true
          sudo find /etc/apt/sources.list.d -type f -exec sed -i 's/azure\.archive\.ubuntu\.com/archive.ubuntu.com/g' {} + 2>/dev/null || true

      - name: Install Playwright browsers
        timeout-minutes: 15
        run: |
          for attempt in 1 2 3; do
            if timeout --kill-after=10 3m pnpm exec playwright install --with-deps chromium; then
              exit 0
            fi
            echo "Playwright browser install attempt $attempt failed or timed out - cleaning up and retrying..."
            # `timeout` only kills the direct child - a timed-out attempt can
            # leave an orphaned `apt-get` (spawned via sudo) still holding the
            # apt lock, which fails every subsequent attempt instantly with
            # "Could not get lock ... held by process N (apt-get)". Clear
            # that out before retrying.
            sudo pkill -9 -f apt-get || true
            sudo rm -f /var/lib/apt/lists/lock /var/cache/apt/archives/lock /var/lib/dpkg/lock /var/lib/dpkg/lock-frontend || true
            sudo dpkg --configure -a || true
            sleep 10
          done
          echo "Playwright browser install failed after 3 attempts"
          exit 1

      - name: Run deploy smoke tests
        run: pnpm test:smoke
        env:
          NEXT_PUBLIC_AUTOTIME_ENV: preview
          NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: offline-ci-anon-key
          NEXT_PUBLIC_STRIPE_PUBLISHABLE_KEY: pk_test_offline_ci
          NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
          SUPABASE_SERVICE_ROLE_KEY: offline-ci-service-role-key
          OPENAI_API_KEY: offline-ci-openai-key
          STRIPE_SECRET_KEY: sk_test_offline_ci
          STRIPE_WEBHOOK_SECRET: whsec_offline_ci
          STRIPE_PRO_MONTHLY_PRICE_ID: price_offline_ci_monthly
          STRIPE_PRO_ANNUAL_PRICE_ID: price_offline_ci_annual
          RESEND_API_KEY: re_offline_ci

      - name: Upload smoke report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: playwright-report/
          retention-days: 14
