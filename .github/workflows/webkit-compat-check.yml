name: WebKit compatibility check (temporary, manual)

on:
  workflow_dispatch:

jobs:
  webkit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps webkit
      - name: Launch WebKit and load production landing page
        run: |
          node -e "
          (async () => {
            const { webkit } = require('@playwright/test');
            const browser = await webkit.launch({ headless: true, timeout: 30000 });
            const page = await browser.newPage();
            const errors = [];
            page.on('pageerror', (e) => errors.push(e.message));
            await page.goto('https://autotime-eu-apply.vercel.app/', { timeout: 20000 });
            const title = await page.title();
            console.log('TITLE:', title);
            console.log('PAGE_ERRORS:', errors.length);
            await browser.close();
            if (errors.length > 0) process.exit(1);
          })().catch((err) => { console.error('FAILED:', err.message); process.exit(1); });
          "
